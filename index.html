<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="description" content="Fehlzeitenprozess der BBS Nienburg/Weser – Leitfaden für Lehrkräfte zum Umgang mit unentschuldigtem Fehlen.">
<title>Fehlzeitenprozess | BBS Nienburg/Weser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blau:#1D4E9E;
  --blau-dunkel:#0E2A54;
  --gruen:#63B32E;
  --gruen-dunkel:#4E9A1F;
  --gruen-tief:#1E5E23;
  --gruen-hell:#EDF7E4;
  --blau-hell:#EEF3FB;
  --tinte:#14202E;
  --grau:#5A6472;
  --linie:#E6EBF2;
  --weiss:#FFFFFF;
  --papier:#F6F9F3;
  --radius:20px;
  --content:1040px;
  --schatten:0 1px 2px rgba(16,34,64,.04),0 8px 24px rgba(16,34,64,.06);
  --schatten-hover:0 2px 4px rgba(16,34,64,.05),0 18px 40px rgba(16,34,64,.12);
  /* Rechner-spezifisch */
  --erf-bg:#EDF7E4;--erf-line:#D2E9BE;
  --fail-bg:#FBEAE8;--fail-line:#F0CFC9;--fail-text:#B25049;
  color-scheme:light only;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--papier)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--tinte);background:var(--papier);line-height:1.65;font-size:16px;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;line-height:1.14;letter-spacing:-.02em}
a{color:var(--gruen-dunkel)}
::selection{background:var(--gruen);color:#fff}

#progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;background:linear-gradient(90deg,var(--gruen),var(--gruen-dunkel));opacity:.95;transition:width .1s linear}

/* Navigation */
nav{position:sticky;top:0;z-index:50;background:rgba(246,249,243,.82);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--linie)}
.nav-inner{max-width:var(--content);margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo-img{height:38px;width:auto;display:block}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav-links a{text-decoration:none;color:var(--grau);font-size:.86rem;font-weight:600;padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--gruen-hell);color:var(--gruen-dunkel)}
.nav-links a.active{background:var(--gruen-dunkel);color:#fff}
.nav-links a.zurueck{color:var(--gruen-dunkel);background:var(--gruen-hell)}
.nav-links a.zurueck:hover{background:#E0F1D0}

/* Hero */
header{position:relative;overflow:hidden;background:radial-gradient(130% 130% at 12% 0%,#2E7D32 0%,#1E5E23 45%,#123F1A 100%);color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.blob.b1{width:540px;height:540px;background:#5FA136;top:-170px;right:-130px;opacity:.32}
.blob.b2{width:400px;height:400px;background:#1D4E9E;bottom:-200px;left:-100px;opacity:.18}
.hero{max-width:var(--content);margin:0 auto;padding:92px 24px 116px;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#EAF7DF;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 15px;border-radius:999px;margin-bottom:26px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#BFE6A0;box-shadow:0 0 0 4px rgba(191,230,160,.28)}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.6rem);font-weight:700;max-width:17ch;margin-bottom:20px;letter-spacing:-.03em;line-height:1.03}
.hero h1 .akz{color:#BFE6A0}
.hero p{max-width:60ch;font-size:clamp(1rem,1.6vw,1.16rem);color:#D6E8C9}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:40px;max-width:760px}
.hero-chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px 18px;transition:transform .3s,background .3s}
.hero-chip:hover{transform:translateY(-4px);background:rgba(255,255,255,.12)}
.hero-chip strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.4rem;letter-spacing:-.02em;color:#fff}
.hero-chip span{font-size:.78rem;color:#C4DDB4}
.hero-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;display:block;z-index:1}

/* Layout */
main{max-width:var(--content);margin:0 auto;padding:0 24px}
section{padding:74px 0;border-bottom:1px solid var(--linie);scroll-margin-top:78px}
section:last-of-type{border-bottom:none}
.kicker{display:inline-block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gruen-dunkel);margin-bottom:12px;padding-bottom:3px;border-bottom:1px solid var(--gruen)}
section h2{font-size:clamp(1.7rem,3.8vw,2.5rem);color:var(--gruen-tief);margin-bottom:16px;letter-spacing:-.03em}
section p.lead{font-size:clamp(1.05rem,1.5vw,1.2rem);color:var(--grau);max-width:66ch;margin-bottom:8px}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal.vis{opacity:1;transform:none}

.hinweis{background:var(--weiss);border:1px solid var(--linie);border-left:3px solid var(--gruen);padding:18px 22px;border-radius:0 14px 14px 0;margin:22px 0;box-shadow:var(--schatten)}
.hinweis strong{color:var(--gruen-tief)}
.hinweis p{margin-bottom:8px}.hinweis p:last-child{margin-bottom:0}

/* ===== Rechner-Raster ===== */
.rechner-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:30px}
.form-col,.rail{min-width:0}
@media(min-width:900px){
  .rechner-grid{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:26px;align-items:start}
  .rail{position:sticky;top:88px}
}
.rcard{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--radius);box-shadow:var(--schatten);overflow:hidden}
.rcard + .rcard{margin-top:22px}
.rcard-head{display:flex;align-items:center;gap:13px;padding:20px 24px 0}
.rcard-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem;color:var(--gruen-dunkel);background:var(--gruen-hell);border:1px solid var(--erf-line);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.rcard-head h3{font-size:1.18rem;color:var(--gruen-tief);margin:0}
.rcard-head .tag{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--grau);background:var(--papier);border:1px solid var(--linie);padding:5px 11px;border-radius:999px;white-space:nowrap}
.rcard-body{padding:16px 24px 24px}

/* Felder */
.feld{display:flex;flex-direction:column;gap:7px}
.feld-row{display:flex;flex-wrap:wrap;gap:16px}
.feld-row .feld{flex:1 1 180px;min-width:0}
label.lbl{font-size:.82rem;font-weight:600;color:var(--grau);letter-spacing:.01em}
input[type=text]{font-family:inherit;font-size:1rem;color:var(--tinte);background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:10px 13px;width:100%;transition:border-color .18s,background .18s,box-shadow .18s}
input[type=text]:focus{outline:none;background:#fff;border-color:var(--gruen);box-shadow:0 0 0 3px var(--gruen-hell)}

/* Semester-Auswahl */
.seg{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.seg label{flex:1 1 170px;cursor:pointer;position:relative;border:1px solid var(--linie);border-radius:13px;padding:13px 15px;background:var(--papier);transition:border-color .18s,background .18s}
.seg label:hover{border-color:var(--gruen)}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.98rem;display:block;color:var(--tinte)}
.seg .d{font-size:.8rem;color:var(--grau);margin-top:2px}
.seg label:has(input:checked){border-color:var(--gruen-dunkel);background:var(--gruen-hell)}
.seg label:has(input:checked) .t{color:var(--gruen-tief)}
.seg label:has(input:focus-visible){box-shadow:0 0 0 3px var(--gruen-hell)}

/* Notentabellen */
.gtab{width:100%;border-collapse:collapse;margin-top:4px}
.gtab th{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grau);text-align:left;padding:0 8px 9px;border-bottom:1px solid var(--linie);vertical-align:bottom}
.gtab th.pt{text-align:center;width:78px}
.gtab td{padding:7px 8px;border-bottom:1px solid var(--linie);vertical-align:middle}
.gtab tbody tr:last-child td{border-bottom:none}
.rowtag{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.82rem;background:var(--gruen-dunkel);color:#fff;border-radius:8px;padding:3px 9px;display:inline-block;min-width:30px;text-align:center}
.rowtag.soft{background:var(--gruen-hell);color:var(--gruen-dunkel);border:1px solid var(--erf-line)}
td.subj{width:100%}
td.subj input{font-size:.94rem;padding:9px 11px;min-width:0}
select.subj{font-family:inherit;font-size:.94rem;color:var(--tinte);background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 11px;width:100%;min-width:0;transition:border-color .18s,box-shadow .18s}
select.subj:focus{outline:none;border-color:var(--gruen);box-shadow:0 0 0 3px var(--gruen-hell);background:#fff}
td.ptcell{text-align:center}
input.pt{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;text-align:center;width:64px;padding:9px 4px;background:var(--papier);border:1px solid var(--linie);border-radius:11px;color:var(--tinte);transition:border-color .18s,box-shadow .18s,background .18s;-moz-appearance:textfield}
input.pt::-webkit-outer-spin-button,input.pt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.pt:focus{outline:none;background:#fff;border-color:var(--gruen);box-shadow:0 0 0 3px var(--gruen-hell)}
input.pt.filled{border-color:var(--erf-line);background:var(--erf-bg)}
input.pt.low{border-color:var(--fail-line);background:var(--fail-bg);color:var(--fail-text)}
td.leer{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(20,32,46,.045) 7px 8px)}
.leer-note{font-size:.72rem;color:#9aa3ad;font-style:italic}

/* Halbjahr-Auswahl für Fach 8 */
.hj8{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.hj8-lbl{font-size:.72rem;color:var(--grau);font-weight:600}
.hj8-btn{font-family:'Space Grotesk',sans-serif;font-size:.82rem;font-weight:600;color:var(--grau);background:var(--papier);border:1px solid var(--linie);border-radius:8px;padding:3px 11px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.hj8-btn:hover{border-color:var(--gruen)}
.hj8-btn.active{background:var(--gruen-hell);border-color:var(--gruen-dunkel);color:var(--gruen-tief)}
.hj8-btn:focus-visible{outline:2px solid var(--gruen);outline-offset:1px}

/* Zwischensumme */
.zsumme{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:14px 18px;border-radius:14px;background:var(--papier);border:1px solid var(--linie)}
.zsumme .s{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.98rem;color:var(--tinte)}
.zsumme .s b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.zsumme .req{font-size:.8rem;color:var(--grau);margin-left:auto;text-align:right;max-width:46ch}
.flag{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.8rem;padding:5px 12px;border-radius:999px;white-space:nowrap}
.flag .dot{width:8px;height:8px;border-radius:50%}
.flag.ok{background:var(--erf-bg);color:var(--gruen-tief);border:1px solid var(--erf-line)}
.flag.ok .dot{background:var(--gruen-dunkel)}
.flag.no{background:var(--fail-bg);color:var(--fail-text);border:1px solid var(--fail-line)}
.flag.no .dot{background:var(--fail-text)}
.flag.idle{background:#EEF1ED;color:#9aa3ad;border:1px solid var(--linie)}
.flag.idle .dot{background:#9aa3ad}

/* Pflichtfächer-Status */
.faecher-status{margin-top:14px;font-size:.86rem;font-weight:600;padding:12px 15px;border-radius:12px;display:flex;align-items:flex-start;gap:9px;line-height:1.45}
.faecher-status .fi{flex:none;font-size:1rem;line-height:1.35}
.faecher-status.idle{background:var(--papier);border:1px solid var(--linie);color:var(--grau)}
.faecher-status.ok{background:var(--erf-bg);border:1px solid var(--erf-line);color:var(--gruen-tief)}
.faecher-status.no{background:var(--fail-bg);border:1px solid var(--fail-line);color:var(--fail-text)}

/* Ergebnis-Karte */
.ergebnis{background:linear-gradient(165deg,#1E5E23,#123F1A);color:#EAF7DF;border-radius:var(--radius);box-shadow:0 14px 44px rgba(18,63,26,.28);overflow:hidden;position:relative}
.ergebnis::after{content:"";position:absolute;width:180px;height:180px;background:radial-gradient(circle,rgba(143,208,92,.24),transparent 70%);top:-60px;right:-50px;pointer-events:none}
.e-top{padding:24px 26px 20px;position:relative}
.e-eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#BFE6A0}
.note-badge{display:flex;align-items:flex-end;gap:16px;margin-top:8px}
.note-num{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:.9;font-size:4.4rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#fff;transition:transform .25s cubic-bezier(.2,.8,.3,1.2)}
.note-num.pulse{transform:scale(1.06)}
.note-meta{padding-bottom:9px}
.note-meta .k{font-size:.78rem;color:#C4DDB4}
.note-meta .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:#fff}
.e-verdict{margin-top:18px;padding:12px 15px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:10px}
.e-verdict.ok{background:rgba(143,208,92,.18);color:#DCF3C6}
.e-verdict.no{background:rgba(224,138,124,.16);color:#F3C9C1}
.e-verdict .b{font-size:1.15rem;flex:none}

.prog{padding:2px 26px 22px;position:relative}
.prog-lbl{display:flex;justify-content:space-between;font-size:.78rem;color:#C4DDB4;margin:14px 0 8px}
.prog-lbl b{color:#fff;font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:rgba(255,255,255,.13);position:relative;overflow:hidden}
.track .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#63B32E,#BFE6A0);width:0;transition:width .45s cubic-bezier(.3,.7,.2,1)}
.track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.6)}
.track-leg{display:flex;justify-content:space-between;font-size:.66rem;color:#9CBE86;margin-top:7px}

.checks{border-top:1px solid rgba(255,255,255,.12);padding:16px 26px 20px}
.check{display:flex;align-items:center;gap:12px;padding:9px 0}
.check + .check{border-top:1px solid rgba(255,255,255,.08)}
.check .ic{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:.95rem;font-weight:700}
.check .ic.ok{background:rgba(143,208,92,.22);color:#BFE6A0}
.check .ic.no{background:rgba(224,138,124,.2);color:#F3C9C1}
.check .ic.idle{background:rgba(255,255,255,.09);color:#9CBE86}
.check .txt{font-size:.86rem;line-height:1.32}
.check .txt .cn{font-family:'Space Grotesk',sans-serif;font-weight:600;color:#fff}
.check .txt .cd{color:#C4DDB4;font-size:.74rem}
.check .val{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.98rem;font-variant-numeric:tabular-nums;color:#fff}

.e-actions{padding:0 26px 24px;display:flex;gap:11px}
.print-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#EAF7DF;color:var(--gruen-tief);border:none;border-radius:999px;padding:11px 16px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.86rem;cursor:pointer;transition:background .2s,transform .15s;flex:1}
.print-btn:hover{background:#fff;transform:translateY(-1px)}
.print-btn:focus-visible{outline:3px solid rgba(255,255,255,.5);outline-offset:2px}
.print-btn svg{width:16px;height:16px}
.reset-btn{background:transparent;color:#C4DDB4;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:11px 16px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.86rem;cursor:pointer;transition:color .2s,border-color .2s;flex:1}
.reset-btn:hover{color:#fff;border-color:rgba(255,255,255,.45)}

/* Fächer-Karten */
.karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:26px 0 0}
.karte{background:var(--weiss);border:1px solid var(--linie);border-radius:var(--radius);padding:24px;box-shadow:var(--schatten);position:relative;overflow:hidden}
.karte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gruen)}
.karte.blau::before{background:var(--blau)}
.karte h4{color:var(--gruen-tief);margin-bottom:10px;font-size:1.05rem}
.karte.blau h4{color:var(--blau-dunkel)}
.karte ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.karte li{position:relative;padding-left:16px;font-size:.9rem;color:var(--grau)}
.karte li::before{content:"›";position:absolute;left:0;color:var(--gruen);font-weight:700}
.karte.blau li::before{color:var(--blau)}

/* Umrechnungstabelle */
.tab-wrap{overflow-x:auto;margin:26px 0 0;border:1px solid var(--linie);border-radius:var(--radius);box-shadow:var(--schatten);background:#fff}
table.umr{border-collapse:collapse;width:100%;font-size:.9rem}
table.umr th,table.umr td{padding:10px 16px;text-align:left;border:1px solid var(--linie);font-variant-numeric:tabular-nums}
table.umr thead th{background:var(--gruen-dunkel);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.82rem;border-color:var(--gruen-dunkel);position:sticky;top:0}
table.umr td.note{font-family:'Space Grotesk',sans-serif;font-weight:700;text-align:right;color:var(--gruen-tief)}
table.umr tr.active td{background:var(--gruen-hell);color:var(--gruen-tief)}
table.umr tr.active td.note{color:var(--gruen-dunkel)}
.umr-hint{font-size:.8rem;color:var(--grau);margin-top:10px}

footer{background:linear-gradient(165deg,#1E5E23,#123F1A);color:#C4DDB4}.footer-inner{max-width:var(--content);margin:0 auto;padding:44px 24px;font-size:.86rem;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer-inner strong{color:#fff;font-family:'Space Grotesk',sans-serif}
.footer-inner a{color:#EAF7DF}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .blob{display:none}
  *{transition:none!important}
}
@media (max-width:640px){
  .hero{padding:66px 22px 84px}
  section{padding:52px 0}
  .nav-links{width:100%;overflow-x:auto;flex-wrap:nowrap;margin-left:0;padding-bottom:2px}
  .nav-links a{white-space:nowrap}
  .zsumme .req{margin-left:0;text-align:left;max-width:none}
  .rcard-body{padding:14px 16px 18px}
  .rcard-head{padding:16px 16px 0}
  .gtab th,.gtab td{padding:6px 5px}
  .gtab th.pt{width:52px}
  input.pt{width:46px;font-size:1rem;padding:8px 2px}
  .rowtag{min-width:26px;padding:3px 6px}
}

/* ---------- Druck (A4) ---------- */
@page{ size:A4 portrait; margin:14mm; }
@media print{
  html,body{background:#fff;font-size:10pt}
  /* Alles ausblenden außer den wichtigen Eingaben links */
  #progress,nav,footer,details.ref,.blob,.hero-wave,.e-actions,
  .hero .eyebrow,.hero p,.hero-stats,
  #faecher,#tabelle,.rail,.zsumme,.faecher-status{display:none!important}

  main{max-width:none;padding:0}
  header{background:#fff;color:#000;overflow:visible;border-radius:0}
  .hero{padding:0 0 6px;max-width:none}
  .hero h1,.hero h1 .akz{color:#000;font-size:15pt;margin:0;max-width:none}

  section#rechner{padding:6px 0 0;border:none}
  section#rechner>.kicker,section#rechner>h2,section#rechner>p.lead{display:none!important}
  .rechner-grid{display:block;margin:0}
  .form-col{min-width:0}

  .rcard{box-shadow:none;border:1px solid #999;border-radius:6px;margin:0 0 8px;break-inside:avoid}
  .rcard+.rcard{margin-top:8px}
  .rcard-head{padding:7px 10px 0}
  .rcard-head h3{font-size:11pt;color:#000}
  .rcard-num{background:#000;color:#fff;border:none;width:19px;height:19px;font-size:9pt}
  .rcard-head .tag{display:none}
  .rcard-body{padding:7px 10px 9px}

  .feld{gap:2px}
  label.lbl{color:#000;font-size:8.5pt}
  input[type=text]{border:1px solid #999;background:#fff;color:#000;padding:4px 8px;font-size:10.5pt}

  /* nur das gewählte Kurshalbjahr zeigen */
  .feld>.lbl{margin-top:2px}
  .seg{gap:0;margin-top:2px}
  .seg label{display:none!important}
  .seg label.chosen{display:inline-block!important;border:1px solid #000;background:#fff;padding:5px 12px;border-radius:6px}
  .seg label.chosen .t{color:#000;font-size:10pt}
  .seg label.chosen .d{color:#333;font-size:8.5pt}

  /* Fächer- und Notentabelle auf A4 skaliert */
  .gtab{font-size:10pt;width:100%;table-layout:fixed}
  .gtab th{color:#000;border-color:#999;padding:0 4px 4px;font-size:7.5pt}
  .gtab th.pt{width:14%}
  .gtab td{border-color:#ddd;padding:3px 4px}
  .rowtag{background:#000;color:#fff}
  .rowtag.soft{background:#eee;color:#000;border:1px solid #999}
  select.subj{-webkit-appearance:none;appearance:none;border:1px solid #999;background:#fff;color:#000;padding:3px 6px;font-size:10pt;width:100%}
  input.pt{background:#fff!important;border:1px solid #999;color:#000!important;width:100%;padding:3px 2px;font-size:10.5pt}
  td.leer{background:#fff}
  .hj8{display:none!important}
}

/* Inhalts-Erweiterungen für den Prozess */
.rcard-body p{color:var(--grau);font-size:.95rem;margin-bottom:10px}
.rcard-body p:last-child{margin-bottom:0}
.rcard-body ol,.rcard-body ul{margin:6px 0 12px 2px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rcard-body li{font-size:.92rem;color:var(--grau);line-height:1.5}
.rcard-body li::marker{color:var(--gruen-dunkel);font-weight:700}
.rcard-body .sub{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gruen-dunkel);margin:14px 0 4px}
.rcard-body .sub:first-child{margin-top:0}
.chip-form{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:600;color:var(--gruen-tief);background:var(--gruen-hell);border:1px solid var(--erf-line);border-radius:999px;padding:4px 12px}
.inline-note{background:var(--papier);border:1px solid var(--linie);border-radius:12px;padding:11px 14px;font-size:.88rem;color:var(--grau);margin-top:12px;line-height:1.5}
.inline-note strong{color:var(--gruen-tief)}
.rcard.rot .rcard-num{color:var(--fail-text);background:var(--fail-bg);border-color:var(--fail-line)}
.karte.rot::before{background:var(--fail-text)}
.karte.rot h4{color:var(--fail-text)}
.karte.rot li::before{color:var(--fail-text)}
.doc-link{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;color:#fff;background:var(--gruen-dunkel);border:1px solid var(--gruen-dunkel);border-radius:999px;padding:9px 16px;text-decoration:none;transition:background .2s,transform .15s;margin-top:4px}
.doc-link:hover{background:var(--gruen-tief);transform:translateY(-1px)}
.doc-link:focus-visible{outline:3px solid var(--gruen-hell);outline-offset:2px}
.doc-link svg{width:16px;height:16px}
</style>
</head>
